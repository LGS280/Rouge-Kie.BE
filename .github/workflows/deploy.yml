```yaml
name: Build and Deploy Rogue-Kie BE to Azure App Service

on:
  push:
    branches:
      - Nhat

workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Rogue-Kie.BE.API/Rogue-Kie.BE.API.csproj

      - name: Build
        run: dotnet build Rogue-Kie.BE.API/Rogue-Kie.BE.API.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Rogue-Kie.BE.API/Rogue-Kie.BE.API.csproj -c Release -o ./publish --no-build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EduPath'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
```
